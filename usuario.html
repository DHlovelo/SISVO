<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="://httpsfonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/usuario.css">
</head>
<body>

    <div class="welcome-text">
        <h2 style="font-family: 'Times New Roman', Times, serif;">bienvenido a <br><i>SISVO</i></h2>
        <p>Descubre tu verdadera vocacion</p>
    </div>

    <div class="register-box">
        <h3>Crear Cuenta</h3>
        
        <form action="#" method="POST">

            <div class="input-group">
                <label for="nombre">nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="nombre" required>
            </div>

            <div class="input-group">
                <label for="CI">Cedula de identidad</label>
                <input type="text" id="CI" name="CI" placeholder="CI" required>
            </div>

            <div class="input-group">
                <label for="gmail">Correo electrónico</label>
                <input type="email" id="gmail" name="gmail" placeholder="@" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="register-btn"><a href="C:\Users\coffe\OneDrive\Desktop\sisvov-app\test.html">registrarse</a></button>
        </form>
        
        <div class="login-footer">
            <p>no tienes una cuenta aun? <a href="C:\Users\coffe\OneDrive\Desktop\SISVO\cuenta_nueva.html">crea aqui</a></p>
        </div>
    </div>

    <script src="registro.js"></script>
</body>
</html>
