<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Vocacional - SISVO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="resources/CSS/style.css">

    <style>
        .test-main {
            --t-panel:       var(--sisvov-panel, #0f1325);
            --t-campo:       var(--sisvov-campo, #151a30);
            --t-campo-hover: var(--sisvov-campo-hover, #1a2038);
            --t-borde:       var(--sisvov-borde, #232945);
            --t-borde-fuerte:var(--sisvov-borde-fuerte, #343b5e);
            --t-texto:       var(--sisvov-texto, #efeae0);
            --t-tenue:       var(--sisvov-texto-tenue, #8f95b3);
            --t-oro:         var(--sisvov-oro, #d8b878);
            --t-oro-claro:   var(--sisvov-oro-claro, #f1e0b5);
            --t-oro-hondo:   var(--sisvov-oro-hondo, #b8955a);
            --t-tinta:       var(--sisvov-oro-tinta, #1d1608);
            --t-lavanda:     var(--sisvov-lavanda, #9aa8e6);
        }

        .test-card {
            position: relative;
            overflow: hidden;
            background: var(--t-panel);
            border: 1px solid var(--t-borde);
            border-radius: 1.75rem;
            box-shadow: 0 40px 80px -35px rgba(0, 0, 0, .85);
            color: var(--t-texto);
            animation: t-entrar .7s cubic-bezier(.2, .7, .2, 1) both;
        }
        .test-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--t-oro), transparent);
            opacity: .8;
        }
        @keyframes t-entrar {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: none; }
        }

        .test-titulo {
            margin: 0 0 .5rem;
            font-size: clamp(1.6rem, 4vw, 2rem);
            font-weight: 700;
            letter-spacing: -.01em;
            color: var(--t-texto);
        }
        .test-intro {
            max-width: 34rem;
            margin: 0 0 1.75rem;
            line-height: 1.65;
            color: var(--t-tenue);
        }

        .test-progreso { margin-bottom: 2rem; }
        .test-progreso-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: .6rem;
            font-size: .85rem;
            color: var(--t-tenue);
        }
        #progresoPorcentaje {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--t-oro);
        }
        .test-progreso .progress {
            height: 8px;
            background: var(--t-campo);
            border-radius: 99px;
        }
        .test-progreso .progress-bar {
            background: linear-gradient(90deg, var(--t-oro-hondo), var(--t-oro));
            border-radius: 99px;
            transition: width .5s cubic-bezier(.2, .7, .2, 1);
        }

        #preguntas { min-height: 15rem; }

        #preguntas .pregunta.activa {
            animation: t-pregunta .4s cubic-bezier(.2, .7, .2, 1) both;
        }
        @keyframes t-pregunta {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        #preguntas .pregunta :is(h1, h2, h3, h4, h5, h6) {
            margin: 0 0 1.25rem;
            font-size: clamp(1.15rem, 3vw, 1.4rem);
            font-weight: 700;
            line-height: 1.4;
            color: var(--t-texto);
        }

        #preguntas .list-group { gap: 0; }

        #preguntas .list-group-item.opcion {
            display: flex;
            align-items: center;
            gap: .9rem;
            padding: 1.05rem 1.2rem;
            margin-bottom: .7rem;
            font-size: 1rem;
            line-height: 1.4;
            color: var(--t-texto);
            background: var(--t-campo);
            border: 1px solid var(--t-borde);
            border-radius: 16px !important;
            cursor: pointer;
            transition: transform .25s ease, border-color .25s ease, background-color .25s ease, box-shadow .25s ease;
        }
        #preguntas .list-group-item.opcion:hover {
            transform: translateX(4px);
            background: var(--t-campo-hover);
            border-color: rgba(216, 184, 120, .5);
        }
        #preguntas .list-group-item.opcion.seleccionada,
        #preguntas .list-group-item.opcion:has(input:checked) {
            background: rgba(216, 184, 120, .12);
            border-color: var(--t-oro);
            box-shadow: 0 0 0 3px rgba(216, 184, 120, .1);
        }

        #preguntas .opcion .form-check {
            display: flex;
            align-items: center;
            gap: .9rem;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        #preguntas .opcion .form-check-label { flex: 1; cursor: pointer; }

        #preguntas .opcion input[type="radio"] {
            -webkit-appearance: none;
            appearance: none;
            flex: none;
            float: none;
            width: 1.25rem;
            height: 1.25rem;
            margin: 0;
            background-color: transparent;
            background-image: none;
            border: 2px solid #4a5280;
            border-radius: 50%;
            cursor: pointer;
            transition: border-color .2s ease, background-image .2s ease;
        }
        #preguntas .opcion:hover input[type="radio"] { border-color: var(--t-oro-hondo); }
        #preguntas .opcion input[type="radio"]:checked {
            border-color: var(--t-oro);
            background-color: transparent;
            background-image: radial-gradient(circle, var(--t-oro) 0 42%, transparent 48%);
            background-size: 100% 100%;
        }
        #preguntas .opcion input[type="radio"]:focus-visible {
            outline: 2px solid var(--t-lavanda);
            outline-offset: 3px;
            box-shadow: none;
        }

        .test-pie {
            display: flex;
            justify-content: space-between;
            gap: .75rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--t-borde);
        }
        .t-btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .8rem 1.6rem;
            font-family: inherit;
            font-size: .95rem;
            font-weight: 600;
            border: 1px solid transparent;
            border-radius: 999px;
            cursor: pointer;
            transition: transform .2s ease, background-color .2s ease, border-color .2s ease, opacity .2s ease;
        }
        .t-btn:disabled { opacity: .35; cursor: not-allowed; }
        .t-btn:focus-visible { outline: 2px solid var(--t-lavanda); outline-offset: 3px; }

        .t-btn-ghost {
            color: var(--t-texto);
            background: transparent;
            border-color: var(--t-borde-fuerte);
        }
        .t-btn-ghost:hover:not(:disabled) {
            border-color: var(--t-lavanda);
            background: rgba(154, 168, 230, .1);
        }
        .t-btn-gold {
            color: var(--t-tinta);
            background: var(--t-oro);
            border-color: var(--t-oro);
        }
        .t-btn-gold:hover:not(:disabled) {
            background: var(--t-oro-claro);
            border-color: var(--t-oro-claro);
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .t-btn { padding: .75rem 1.2rem; font-size: .9rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .test-card, #preguntas .pregunta.activa { animation: none; }
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-sisvov">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                SIS<span>VO</span>
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false"
                    aria-label="Alternar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="#">Chatbot</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="test.html">Test</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Carreras</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Instituciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Convocatorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Becas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 test-main">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">

                <div class="test-card">
                    <div class="p-4 p-md-5">

                        <h1 class="test-titulo">Test Vocacional</h1>
                        <p class="test-intro">
                            Responde con la opción que más te suene.
                            Sé honesto, no hay respuestas correctas o incorrectas.
                        </p>

                        <div class="test-progreso">
                            <div class="test-progreso-info">
                                <span id="progresoTexto">Pregunta 1 de 10</span>
                                <span id="progresoPorcentaje">10%</span>
                            </div>
                            <div class="progress" role="progressbar"
                                 aria-label="Progreso del test"
                                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="10">
                                <div class="progress-bar" id="progresoFill" style="width: 10%"></div>
                            </div>
                        </div>

                        <div id="preguntas"></div>

                        <div class="test-pie">
                            <button type="button" id="btnAnterior" class="t-btn t-btn-ghost" disabled>
                                ← Anterior
                            </button>
                            <button type="button" id="btnSiguiente" class="t-btn t-btn-gold" disabled>
                                Siguiente →
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="resources/JS/test.js"></script>
</body>
</html>
