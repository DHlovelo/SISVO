<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Vocacional - SISVO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="resources/CSS/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-sisvov">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                SIS<span>VO</span>
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false"
                    aria-label="Alternar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="#">Chatbot</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="test.html">Test</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Carreras</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Instituciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Convocatorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Becas</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">

                
                <div class="card card-sisvov shadow-lg rounded-4 border-0">
                    <div class="card-body p-4 p-md-5">

                        <h1 class="h3 fw-bold mb-2">Test Vocacional</h1>
                        <p class="text-secondary mb-4">
                            Responde con la opción que más te suene.
                            Se honesto, no hay respuestas correctas o incorrectas.
                        </p>

                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <small class="text-secondary" id="progresoTexto">Pregunta 1 de 10</small>
                            <small class="text-secondary" id="progresoPorcentaje">10%</small>
                        </div>
                        <div class="progress mb-4" role="progressbar"
                             aria-label="Progreso del test"
                             aria-valuemin="0" aria-valuemax="100" aria-valuenow="10">
                            <div class="progress-bar progress-bar-striped progress-bar-animated"
                                 id="progresoFill" style="width: 10%"></div>
                        </div>

                        
                        <div id="preguntas"></div>


                        <div class="d-flex justify-content-between mt-4 pt-3 border-top border-secondary-subtle">
                            <button id="btnAnterior" class="btn btn-outline-light rounded-pill px-4" disabled>
                                ← Anterior
                            </button>
                            <button id="btnSiguiente" class="btn btn-light rounded-pill px-4 fw-semibold" disabled>
                                Siguiente →
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="resources/JS/test.js"></script>
</body>
</html>
